name: catalog

on:
  push:
    branches:
      - main
    paths:
      - "SKILL.md"
      - "VERSION"
      - "README.md"
      - "README.ko.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "install.sh"
      - "install.ps1"
      - "agents/**"
      - "commands/**"
      - "knowledge/**"
      - "references/**"
      - "scripts/**"
      - "tools/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests + offline smoke
        run: |
          python -m unittest discover -s tests -v
          bash tools/smoke_test.sh --offline

      - name: Build catalog
        run: bash tools/package.sh

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/catalog

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
