name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test "v$(cat VERSION)" = "${GITHUB_REF_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION $(cat VERSION)" >&2
            exit 1
          }

      - name: Smoke test
        run: bash tools/smoke_test.sh

      - name: Package
        run: bash tools/package.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: us-sleep-regulatory
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true
