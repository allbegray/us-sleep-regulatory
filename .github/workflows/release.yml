name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test "v$(cat VERSION)" = "${GITHUB_REF_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION $(cat VERSION)" >&2
            exit 1
          }

      - name: Smoke test
        run: bash tools/smoke_test.sh

      - name: Package
        run: bash tools/package.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: us-sleep-regulatory
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install, check, uninstall (PowerShell)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $base = Join-Path $env:RUNNER_TEMP "skill-home"
          .\install.ps1 -Target all -BaseDir $base -NoDoctor -Force

          $paths = @(
            "$base\.agents\skills\us-sleep-regulatory\SKILL.md",
            "$base\.claude\skills\us-sleep-regulatory\SKILL.md",
            "$base\.config\opencode\skills\us-sleep-regulatory\SKILL.md",
            "$base\.config\opencode\commands\us-sleep-regulatory.md",
            "$base\.agents\skills\us-sleep-regulatory\install.ps1",
            "$base\.agents\skills\us-sleep-regulatory\README.ko.md",
            "$base\.agents\skills\us-sleep-regulatory\knowledge\seed\cfr-21-882.5801.md"
          )
          foreach ($p in $paths) {
            if (-not (Test-Path -LiteralPath $p)) { throw "missing: $p" }
          }

          python "$base\.agents\skills\us-sleep-regulatory\scripts\reg.py" guidance --topic device --format md | Out-Null
          $env:US_REG_KB = "$base\kb.sqlite"
          python "$base\.agents\skills\us-sleep-regulatory\scripts\reg.py" kb search "QVO predicate" --format md | Out-Null

          .\install.ps1 -Target all -BaseDir $base -Verify
          if ($LASTEXITCODE -ne 0) { throw "verify failed" }

          .\install.ps1 -Target all -BaseDir $base -Uninstall
          foreach ($p in $paths) {
            if (Test-Path -LiteralPath $p) { throw "not removed: $p" }
          }


      - name: Auto-install Python path
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $base = Join-Path $env:RUNNER_TEMP "skill-home-python"
          .\install.ps1 -Target codex -BaseDir $base -NoDoctor -Force -ForcePythonInstall
          $py = Get-ChildItem "$env:LOCALAPPDATA\Programs\Python" -Filter "python.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $py) { throw "Python was not installed" }
          & $py.FullName -c "import sys; print(sys.version)"
          .\install.ps1 -Target codex -BaseDir $base -Uninstall

      - name: Checksum verification (local zip)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pkgDir = Join-Path $env:RUNNER_TEMP "pkg-checksum"
          New-Item -ItemType Directory -Force -Path $pkgDir | Out-Null
          $zip = Join-Path $pkgDir "skill.zip"
          $items = Get-ChildItem -Force | Where-Object { $_.Name -notin @(".git", "dist", ".idea", "__pycache__") }
          Compress-Archive -Path $items.FullName -DestinationPath $zip -Force
          $sha = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash

          $okBase = Join-Path $env:RUNNER_TEMP "skill-home-checksum"
          .\install.ps1 -Target codex -BaseDir $okBase -From $zip -Sha256 $sha -NoDoctor -Force
          if (-not (Test-Path "$okBase\.agents\skills\us-sleep-regulatory\SKILL.md")) {
            throw "checksum-verified install produced no skill"
          }
          .\install.ps1 -Target codex -BaseDir $okBase -Uninstall

          $badBase = Join-Path $env:RUNNER_TEMP "skill-home-badsum"
          $rejected = $false
          try {
            .\install.ps1 -Target codex -BaseDir $badBase -From $zip -Sha256 ("0" * 64) -NoDoctor -Force
          } catch {
            if ($_.Exception.Message -match "checksum mismatch") { $rejected = $true } else { throw }
          }
          if (-not $rejected) { throw "installer accepted a bad checksum" }


  release:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: us-sleep-regulatory
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true
