name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
        exclude:
          # Windows CI covers the installer in release.yml; one interpreter is
          # enough to catch path/encoding regressions here.
          - os: windows-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Unit tests (offline)
        run: python -m unittest discover -s tests -v

      - name: Offline smoke
        if: runner.os != 'Windows'
        run: bash tools/smoke_test.sh --offline
